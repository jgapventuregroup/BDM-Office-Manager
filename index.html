<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDM Office Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header>
  <div><div class="eyebrow">BDM CONSTRUCTION</div><h1>Office Manager</h1></div>
  <div class="date" id="todayDate"></div>
</header>
<div class="quick">
  <button data-add="task">+ Add Task</button>
  <button data-add="followup">+ Follow Up</button>
  <button data-add="note">+ Note</button>
</div>
<nav id="nav">
  <button class="active" data-view="today">Today</button>
  <button data-view="tasks">Tasks</button>
  <button data-view="followups">Follow Ups</button>
  <button data-view="projects">Projects</button>
  <button data-view="notes">Notes</button>
  <button data-view="learning">Things I'm Learning</button>
</nav>
<main id="content"></main>
</div>
<script src="app.js"></script>
</body>
</html>
