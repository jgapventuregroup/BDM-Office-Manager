<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDM Office Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<aside>
  <div class="brand"><div class="mark">BDM</div><div><strong>BDM Construction</strong><span>Office Manager</span></div></div>
  <nav id="nav">
    <button class="active" data-view="today">⌂ <span>Today</span></button>
    <button data-view="tasks">✓ <span>Tasks</span></button>
    <button data-view="followups">↻ <span>Follow Ups</span></button>
    <button data-view="projects">▣ <span>Projects</span></button>
    <button data-view="notes">✎ <span>Notes</span></button>
    <button data-view="learning">★ <span>Things I'm Learning</span></button>
  </nav>
  <div class="side-note">Keep it simple.<br>Keep the office moving.</div>
</aside>
<section class="main">
<header>
  <div><div class="eyebrow">OFFICE DASHBOARD</div><h1>Good morning</h1><div class="muted">Everything you need for the day in one place.</div></div>
  <div class="date" id="todayDate"></div>
</header>
<div class="quick">
  <button data-add="task">+ Add Task</button>
  <button data-add="followup">+ Follow Up</button>
  <button data-add="note">+ Note</button>
</div>
<main id="content"></main>
</section>
</div>
<script src="app.js"></script>
</body>
</html>
