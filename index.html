<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDM Office Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-locked">
<div id="loginGate" class="login-gate"><div class="login-card"><div class="login-mark">BDM</div><div class="eyebrow">BDM CONSTRUCTION</div><h1>Office Manager</h1><p class="muted">Sign in to open the office dashboard.</p><label>Email</label><input id="authEmail" type="email" value="lesleigh@bdm-construction.com" autocomplete="username"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"><button id="authLogin" class="login-primary">Sign In</button><button id="authCreate" class="login-secondary">Create Account</button><div id="authMessage" class="auth-message"></div></div></div><div class="shell">
<aside>
  <div class="brand"><div class="mark">BDM</div><div><strong>BDM Construction</strong><span>Office Manager</span></div></div>
  <nav id="nav">
    <button class="active" data-view="today">⌂ <span>Today</span></button>
    <button data-view="tasks">✓ <span>Tasks</span></button>
    <button data-view="followups">↻ <span>Follow Ups</span></button>
    <button data-view="appointments">◷ <span>Appointments</span></button>
    <button data-view="calls">☎ <span>Calls</span></button>
    <button data-view="reminders">! <span>Reminders</span></button>
    <button data-view="projects">▣ <span>Projects</span></button>
    <button data-view="notes">✎ <span>Notes</span></button>
    <button data-view="learning">★ <span>Things I'm Learning</span></button>
  </nav>
  <div class="side-note">Keep it simple.<br>Keep the office moving.</div>
</aside>
<section class="main">
<header>
  <div><div class="eyebrow">OFFICE DASHBOARD</div><h1>Good morning</h1><div class="muted">Everything you need for the day in one place.</div></div>
  <div class="date"><div id="todayDate"></div><button id="logoutBtn" class="logout-btn">Sign Out</button></div>
</header>
<div class="searchbar"><input id="globalSearch" placeholder="Search customers, projects, notes, tasks..."><button id="searchBtn">Search</button></div>
<div class="utility">
  <button id="backupBtn">⬇ Backup</button>
  <button id="restoreBtn">⬆ Restore</button>
  <button id="importBtn">⬆ Import Spreadsheet / Word</button>
  <input id="restoreFile" type="file" accept=".json" hidden>
  <input id="importFile" type="file" accept=".xlsx,.xls,.csv,.docx" hidden>
</div>
<div class="quick">
  <button data-add="task">+ Add Task</button>
  <button data-add="followup">+ Follow Up</button>
  <button data-add="appointment">+ Appointment</button>
  <button data-add="call">+ Call</button>
  <button data-add="note">+ Note</button>
</div>
<main id="content"></main>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="app.js?v=20260928-6"></script>
</body>
</html>
